name: 美股收盘扫描
on:
  workflow_dispatch:
  schedule:
    - cron: '23 21,22,23 * * 1-5'
permissions:
  contents: read
concurrency:
  group: jlawradar-close
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: keneee99/jlawradar-engine
          ref: main
          path: scanner
          ssh-key: ${{ secrets.RADAR_ENGINE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - name: 读取上一份行情缓存
        uses: actions/cache@v4
        with:
          path: scanner/data/cache
          key: tfq-pkl-v1-${{ github.run_id }}
          restore-keys: tfq-pkl-v1-
      - run: pip install -r scanner/requirements.txt
      - run: python scanner/refresh.py
      - run: python scanner/build_report.py
      - run: cp scanner/dist/report.js dist/report.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: publish
        uses: actions/deploy-pages@v4
